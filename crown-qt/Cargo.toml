[package]
name = "crown-qt"
version = "0.1.0"
edition = "2021"

[dependencies]
crown-core = { path = "../crown-core" }
cxx = "1"
cxx-qt = "0.9.1"
# `full` also pulls in unused Qt<->third-party conversions (e.g. the `image`
# crate, twice); `qt_full` alone covers everything this app's QML imports use.
cxx-qt-lib = { version = "0.9.1", features = ["qt_full"] }
tokio.workspace = true
dotenvy.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }
