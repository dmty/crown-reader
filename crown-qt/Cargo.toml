[package]
name = "crown-qt"
version = "0.1.0"
edition = "2021"

[dependencies]
crown-core = { path = "../crown-core" }
cxx = "1"
cxx-qt = "0.9.1"
# `full` adds Qt<->third-party conversions we never call, including the `image`
# crate twice. `qt_full` is qt_gui + qt_qml + qt_quickcontrols, which is all the
# QML imports need.
cxx-qt-lib = { version = "0.9.1", features = ["qt_full"] }
tokio.workspace = true
dotenvy.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }
