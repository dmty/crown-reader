[package]
name = "crown-qt"
version = "0.1.0"
edition = "2021"

[dependencies]
crown-core = { path = "../crown-core" }
cxx = "1"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["full"] }
tokio.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }
